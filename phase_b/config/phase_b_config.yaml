# =============================================================================
# Phase B Configuration — Structural-Trajectory Analysis
# =============================================================================

# Root directories (absolute; use forward slashes or raw backslashes)
data_root: "D:/data_code_masterthesis/data"
phase_a_root: "D:/data_code_masterthesis/code/phase_a"
phase_b_root: "D:/data_code_masterthesis/code/phase_a/phase_b"

# Join key column name (must match across ALL tables before every merge)
aza_id_col: "unit_id"           # e.g. "aza:Aomori:022010010"
unit_code_col: "unit_code"      # numeric string e.g. "022010010"

# --- Phase A inputs (paths relative to phase_a_root) -----------------------
phase_a:
  eo_trajectory:       "outputs/final/features_table_aza.parquet"
  classification_ready: "preprocessing/outputs/classification_ready_aza.csv"
  aza_polygons:        "admin_demographics/boundaries/aza.gpkg"
  # Per-calendar-month cache written by data_preprocessing/gee_dw_monthly.py.
  # A (unit_id, month) pair is a GENUINE Dynamic World observation if it is
  # present here with a non-null value; absent/NaN means pipeline.py step 4e
  # left the static gee_lulc.py fallback value in the monthly panel instead.
  dw_monthly_cache:    "outputs/gee/dw_monthly"

# --- NLNI accessibility layers (paths relative to data_root) ---------------
nlni:
  did:
    aomori: "nlni_data_japan/DID/A16-15_02_GML/A16-15_02_DID.shp"
    akita:  "nlni_data_japan/DID/A16-15_05_GML/A16-15_05_DID.shp"
    assumed_crs: "EPSG:4612"    # no .prj in DID shapefiles; JGD2000 geographic
    skip_datetime_field: "A16_011"  # year-0 date field that crashes pyogrio
  medical:
    aomori: "nlni_data_japan/Hospitals/P04-14_02_GML/P04-14_02_GML/P04-14_02-g_MedicalInstitution.shp"
    akita:  "nlni_data_japan/Hospitals/P04-14_05_GML/P04-14_05_GML/P04-14_05-g_MedicalInstitution.shp"
    hospital_type_col: "P04_001"  # 1 = hospital (>=20 beds); 2/3 = clinic
    hospital_type_code: "1"
  schools:
    aomori: "nlni_data_japan/Schools/P29-13_02/P29-13_02/P29-13_02.shp"
    akita:  "nlni_data_japan/Schools/P29-13_05/P29-13_05/P29-13_05.shp"
    school_type_col: "P29_003"   # elementary = 16002 in 2013 vintage
    elementary_type_code: "16001"
  bus_stops:
    aomori: "nlni_data_japan/Bus_stops/P11-10_02_GML/P11-10_02_GML/P11-10_02-jgd-g_BusStop.shp"
    akita:  "nlni_data_japan/Bus_stops/P11-10_05_GML/P11-10_05_GML/P11-10_05-jgd-g_BusStop.shp"
    assumed_crs: "EPSG:4612"
  bus_routes:
    aomori: "nlni_data_japan/Bus_routes/N07-11_02_GML/N07-11_02_GML/N07-11_02.shp"
    akita:  "nlni_data_japan/Bus_routes/N07-11_05_GML/N07-11_05_GML/N07-11_05.shp"
    assumed_crs: "EPSG:4612"
  community_facilities:  # P05 — LocalGovernmentOffice & PublicMeetingFacility
    aomori: "nlni_data_japan/P05/P05-10_02_GML/P05-10_02-g_LocalGovernmentOfficeAndPublicMeetingFacility.shp"
    akita:  "nlni_data_japan/P05/P05-10_05_GML/P05-10_05-g_LocalGovernmentOfficeAndPublicMeetingFacility.shp"
    assumed_crs: "EPSG:4612"  # no .prj; JGD2000 geographic
  buffer_radii_m: [1000, 3000, 5000]  # meters for count-within-buffer features

# --- Census small-area age 2015 (relative to data_root) -------------------
census:
  # tblT000848 = population by sex and households; tblT000849 = age breakdown
  pop_sex_households:
    aomori: "census_data_japan_aza/2015/tblT000848C02/tblT000848C02.txt"
    akita:  "census_data_japan_aza/2015/tblT000848C05/tblT000848C05.txt"
  age_5yr:
    aomori: "census_data_japan_aza/2015/tblT000849C02/tblT000849C02.txt"
    akita:  "census_data_japan_aza/2015/tblT000849C05/tblT000849C05.txt"
  key_code_col: "KEY_CODE"
  aza_hyosyo_code: 2            # HYOSYO=2 means aza-level row

# --- Housing and Land Survey 2013 (relative to data_root) -----------------
# a047 = cities (市), a048 = towns & villages (町村)
housing:
  tenure_age_dilapidation_2013:
    aomori_city:   "housing_data_japan/2013/Aomori-ken/a047.xls"
    aomori_town:   "housing_data_japan/2013/Aomori-ken/a048.xls"
    akita_city:    "housing_data_japan/2013/Akita-ken/a047.xls"
    akita_town:    "housing_data_japan/2013/Akita-ken/a048.xls"
  # Column positions in the XLS (0-indexed; verified against a048.xls Table 22)
  row_type_col: 5     # 1=住宅総数-row, 2=持ち家, 3=借家, ...
  total_col: 10       # 総数 (total dwellings)
  pre1981_cols: [11, 12]  # 昭和45年以前(≤1970) + 昭和46-55年(1971-1980)
  muni_name_col: 7    # col containing Japanese municipality name in section headers
  muni_name_en_col: 8 # col containing English name — marks a header row

# --- Municipal finance — 決算カード PDFs (relative to data_root) -----------
# LEAKAGE RULE: only fiscal years <= 2014 may be loaded.
finance:
  pdf_dir: "finance_data_japan"
  min_fiscal_year: 1998   # skip FY < this (FY1997 incomplete/excluded)
  max_fiscal_year: 2014   # assert FY <= this; raise if violated
  # Regex patterns to extract values from PDF text (label → output column name)
  # Spaces between kanji characters are normalised away before matching.
  metrics:
    local_tax:          "地方税"
    local_alloc_tax:    "地方交付税"
    total_revenue:      "歳入総額"
    total_expenditure:  "歳出総額"
    std_fiscal_revenue: "基準財政収入額"
    std_fiscal_need:    "基準財政需要額"
    real_balance:       "実質収支"

# --- Kaso designation (一部過疎 aza-accuracy) -------------------------------
kaso:
  # Pre-Heisei-merger municipal boundaries (MLIT KSJ N03, 2000-10-01 vintage;
  # predates all six mergers affecting the 一部過疎 municipalities, 2005-2006).
  # Used to resolve partial designation to aza accuracy: only aza whose
  # representative point falls inside a designated 旧町村 polygon inherit
  # kaso_type=1; other aza of the same municipality get 0.
  premerger_boundaries:
    aomori: "kaso_list/boundaries_2000/pref_02/N03-001001_02-g_AdministrativeBoundary.shp"
    akita:  "kaso_list/boundaries_2000/pref_05/N03-001001_05-g_AdministrativeBoundary.shp"
  encoding: "cp932"          # DBF is Shift_JIS
  assumed_crs: "EPSG:4612"   # KS-META metadata: JGD2000 (B, L); shapefile has no .prj
  muni_name_col: "N03_004"   # pre-merger municipality name (e.g. 相馬村, 碇ケ関村)
  muni_code_col: "N03_007"   # 5-digit JIS code of the pre-merger municipality

# --- Heisei merger records (relative to data_root) ------------------------
merger:
  file_1: "merger_data_japan/000283317.xls"
  file_2: "merger_data_japan/000283318.xls"
  date_col: 2          # 合併期日 (merger date)
  pref_col: 1          # 都道府県
  new_name_col: 3      # 名称 (new municipality name)
  type_col: 4          # 合併の方式 (編入/新設)
  members_col: 5       # 関係市町村
  reference_date: "2015-01-01"   # years-since-merger computed relative to here

# --- Target building -------------------------------------------------------
target:
  physical_indicator: "S2_NDBI_contrast_mean"        # level target (kept for reference)
  physical_indicator_trajectory: "S2_NDBI_contrast_slope"  # RETIRED: GLCM slope (area artifact)
  physical_indicator_ndbi: "NDBI_slope"              # RETIRED: spatial gradient artifact (ICC=0.889, Moran's I=0.992)
  physical_indicator_dw_bare: "dw_bare_frac_slope"  # SUPERSEDED 2026-06-30: plain-OLS slope on a panel that is
                                                     # ~46% static-fallback months (see dw_monthly coverage gap
                                                     # below); a handful of end-of-series spike months produce
                                                     # extreme high-leverage slopes that RobustScaler then amplifies.
                                                     # CV R2=-0.59+/-0.78. Kept only for before/after comparison.
                                                     # See phase_b/FINDINGS.md "Target Validation: Theil-Sen Fix".
  physical_indicator_dw_bare_robust: "dw_bare_frac_slope_theilsen"  # ACTIVE: Theil-Sen slope computed only from
                                                     # genuine (non-fallback) monthly Dynamic World observations.
                                                     # See target_builder.py:_compute_dw_bare_theilsen_slope.
  min_genuine_months: 24  # minimum genuine (non-fallback) DW monthly obs required to fit the robust slope;
                           # every aza has >=49 genuine months in practice (see FINDINGS.md), so this is a
                           # safety floor, not an active filter.
  demographic_regressors:
    - "elderly_ratio"    # ratio of 65+ to total pop (2015 vintage)
    - "pop_total"        # scale control (2015 vintage)
  vif_threshold: 10.0    # drop regressors with VIF > this (reuses Phase A logic)
  output_col: "physical_residual"

# --- Feature matrix guards -------------------------------------------------
feature_matrix:
  # These columns must NEVER appear in the final feature matrix.
  # Rule: Phase B predicts the decoupling target from socio-economic /
  # institutional / accessibility features — NEVER from remote sensing.
  # EO outcome window is 2015-2025; all predictors must pre-date 2015.
  banned_columns:
    # --- Target-leakage: continuous aging ratios (used to build the target) ---
    - "elderly_ratio"
    - "aging_index"
    - "youth_ratio"
    - "shrinkage_class"
    - "shrinkage_code"
    - "age_65_plus"
    - "age_u15"
    - "pop_total"
    # --- EO/RS: Sentinel-2 raw bands -----------------------------------------
    - "B4_mean"
    - "B4_std"
    - "B8_mean"
    - "B8_std"
    - "B11_mean"
    - "B11_std"
    # --- EO/RS: spectral index trajectories ----------------------------------
    - "NDVI_mean"
    - "NDVI_std"
    - "NDVI_slope"
    - "NDVI_seasonal_amp"
    - "NDBI_mean"
    - "NDBI_std"
    - "NDBI_slope"
    - "NDBI_seasonal_amp"
    - "MNDWI_mean"
    - "MNDWI_std"
    - "MNDWI_slope"
    - "MNDWI_seasonal_amp"
    # --- EO/RS: GLCM texture (IS the target component — most circular) -------
    - "S2_NDBI_contrast_mean"
    - "S2_NDBI_contrast_std"
    - "S2_NDBI_entropy_mean"
    - "S2_NDBI_entropy_std"
    # --- EO/RS: Dynamic World LULC fractions ---------------------------------
    # dw_bare_frac is now monthly time-varying; preprocessing produces three
    # derived columns below.  dw_bare_frac_slope is excluded as a predictor
    # (it is a Phase B target candidate, not an input feature).
    - "dw_bare_frac_mean"
    - "dw_bare_frac_std"
    - "dw_bare_frac_slope"
    - "dw_built_frac"
    - "dw_crops_frac"
    - "dw_flooded_vegetation_frac"
    - "dw_grass_frac"
    - "dw_shrub_and_scrub_frac"
    - "dw_trees_frac"
    - "dw_water_frac"
    # --- EO/RS: VIIRS nighttime lights ---------------------------------------
    - "viirs_mean_mean"
    - "viirs_mean_slope"
    - "viirs_mean_std"
    # --- EO/RS: OSM built stock (no temporal constraint, Phase A pipeline) ---
    - "osm_built_area"
    - "osm_built_ratio"
    # --- EO terrain: satellite DEM derivatives (Copernicus/SRTM) ------------
    - "aspect_cos_mean"
    - "aspect_sin_mean"
    - "elevation_mean"
    - "elevation_std"
    - "slope_mean"
    - "slope_std"
    - "tri_mean"

# --- Cross-validation -------------------------------------------------------
cross_validation:
  strategy: "grouped_stratified_kfold"   # municipality-blocked spatial CV
  n_splits: 5
  n_repeats: 5
  random_state: 42
  grouping:
    enabled: true
    field: "muni_code"    # derived from unit_id[:5] of unit_code
  loo_check:
    enabled: true
    models: [xgboost]

# --- XGBoost model ---------------------------------------------------------
model:
  xgboost:
    n_estimators: 200
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
    eval_metric: "rmse"
    random_state: 42
    n_jobs: -1

# --- SHAP / explain --------------------------------------------------------
explain:
  n_background: 50          # kmeans background sample for TreeExplainer
  case_shortlist_n: 10      # top-N positive residuals for case table
  mechanism_taxonomy:       # feature prefix → mechanism cluster label
    # Sanctioned predictor families only (no EO/RS prefixes)
    fin_:        "institutional_fiscal"
    kaso:        "institutional_policy"
    merged:      "institutional_merger"
    years_since: "institutional_merger"
    hls_:        "durability_housing"
    dist_did:    "accessibility_did"
    dist_med:    "accessibility_medical"
    dist_hosp:   "accessibility_hospital"
    dist_school: "accessibility_education"
    dist_elem:   "accessibility_education"
    dist_bus:    "accessibility_transit"
    dist_com:    "accessibility_community"
    in_did:      "accessibility_did"
    n_med:       "accessibility_medical"
    n_school:    "accessibility_education"
    n_bus:       "accessibility_transit"
    n_community: "accessibility_community"
    elderly_flag: "demographic_threshold"
    household:   "demographic_threshold"

# --- Spatial projection for distance computation --------------------------
crs_project: "EPSG:6680"    # JGD2011 Japan Zone 10 (meters)

# --- Spatial autocorrelation diagnostics (spatial_autocorrelation.py) ------
# Moran's I on (a) the residual target itself and (b) the CV out-of-fold
# residuals, per FINDINGS.md improvement #5. Mirrors the Phase A diagnostic
# in typology/src/step3_relationships.py (Queen contiguity, permutation p).
spatial:
  weights: "queen"          # Queen contiguity on dissolved aza polygons
  permutations: 999         # permutation count for pseudo p-value
  seed: 42                  # numpy seed for the permutation draw

# --- Output paths (relative to phase_b_root) ------------------------------
output:
  # Level target (original)
  residuals:                    "outputs/target_residuals.parquet"
  cv_results:                   "outputs/cv_results.json"
  shap_values:                  "outputs/shap_values.parquet"
  case_shortlist:               "outputs/case_shortlist.csv"
  # Trajectory target — GLCM slope (RETIRED: area artifact, r=0.00 vs NDBI_slope)
  residuals_trajectory:         "outputs/target_trajectory.parquet"
  cv_results_trajectory:        "outputs/cv_results_trajectory.json"
  shap_values_trajectory:       "outputs/shap_values_trajectory.parquet"
  case_shortlist_trajectory:    "outputs/case_shortlist_trajectory.csv"
  # NDBI trajectory target (RETIRED: spatial gradient artifact)
  residuals_ndbi:               "outputs/target_ndbi_trajectory.parquet"
  cv_results_ndbi:              "outputs/cv_results_ndbi.json"
  shap_values_ndbi:             "outputs/shap_values_ndbi.parquet"
  case_shortlist_ndbi:          "outputs/case_shortlist_ndbi.csv"
  # DW bare-fraction slope target (SUPERSEDED 2026-06-30 - plain OLS, kept for comparison)
  residuals_dw_bare:            "outputs/target_dw_bare_trajectory.parquet"
  cv_results_dw_bare:           "outputs/cv_results_dw_bare.json"
  shap_values_dw_bare:          "outputs/shap_values_dw_bare.parquet"
  case_shortlist_dw_bare:       "outputs/case_shortlist_dw_bare.csv"
  # DW bare-fraction Theil-Sen slope target (ACTIVE - genuine-month-filtered, robust)
  residuals_dw_bare_robust:     "outputs/target_dw_bare_robust_trajectory.parquet"
  cv_results_dw_bare_robust:    "outputs/cv_results_dw_bare_robust.json"
  shap_values_dw_bare_robust:   "outputs/shap_values_dw_bare_robust.parquet"
  case_shortlist_dw_bare_robust: "outputs/case_shortlist_dw_bare_robust.csv"
  # Spatial autocorrelation diagnostics (one JSON + per-unit parquet per variant)
  spatial_autocorrelation:                    "outputs/spatial_autocorrelation.json"
  spatial_residuals:                          "outputs/spatial_residuals.parquet"
  spatial_autocorrelation_trajectory:         "outputs/spatial_autocorrelation_trajectory.json"
  spatial_residuals_trajectory:               "outputs/spatial_residuals_trajectory.parquet"
  spatial_autocorrelation_ndbi:               "outputs/spatial_autocorrelation_ndbi.json"
  spatial_residuals_ndbi:                     "outputs/spatial_residuals_ndbi.parquet"
  spatial_autocorrelation_dw_bare:            "outputs/spatial_autocorrelation_dw_bare.json"
  spatial_residuals_dw_bare:                  "outputs/spatial_residuals_dw_bare.parquet"
  spatial_autocorrelation_dw_bare_robust:     "outputs/spatial_autocorrelation_dw_bare_robust.json"
  spatial_residuals_dw_bare_robust:           "outputs/spatial_residuals_dw_bare_robust.parquet"
  # Shared
  accessibility:                "outputs/accessibility_features.parquet"
  feature_matrix:               "outputs/feature_matrix.parquet"
  manifest:                     "manifest.md"

random_state: 42
